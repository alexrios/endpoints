version: 2

builds:
  - ldflags:
      - -s -w
      - -extldflags "-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    format: binary
    format_overrides:
      - goos: windows
        format: zip

dockers:
  - image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-amd64"
    use: buildx
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile

  - image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-arm64"
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile

docker_manifests:
  - name_template: "ghcr.io/alexrios/endpoints:{{ .Tag }}"
    image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-amd64"
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/alexrios/endpoints:v{{ .Major }}"
    image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-amd64"
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/alexrios/endpoints:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-amd64"
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/alexrios/endpoints:latest"
    image_templates:
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-amd64"
      - "ghcr.io/alexrios/endpoints:{{ .Tag }}-arm64"
